# Publish to Open VSX + VS Code Marketplace (Trusted Publishing OIDC).
#
# Declarative extension (grammar, themes, snippets): no npm dependencies, no build, lint or tests.
#
# Setup required outside this repo (not done by this workflow):
# - VS Code Marketplace Trusted Publishing policy for publisher "bhu" must list:
#     repository  bhuertgen/amo-language-vscode
#     workflow    publish.yml
#     environment publish
# - GitHub environment "publish" in this repo (optionally with required reviewers).
# - Optional secret OVSX_PAT in the "publish" environment for Open VSX (namespace "bhu").
#   Without it, the Open VSX step is skipped with a notice.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only package (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.pkg.outputs.vsix }}
      prerelease: ${{ steps.pkg.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Package VSIX
        id: pkg
        env:
          PRERELEASE: ${{ github.event.release.prerelease && 'true' || 'false' }}
        run: |
          version="$(node -p "require('./package.json').version")"
          vsix="amo-language-${version}.vsix"
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes @vscode/vsce package --no-dependencies $flags -o "$vsix"
          npx --yes @vscode/vsce ls --no-dependencies
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.pkg.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish to Open VSX + Marketplace
    needs: build-test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: publish
    env:
      VSIX: ${{ needs.build-test.outputs.vsix }}
      PRERELEASE: ${{ needs.build-test.outputs.prerelease }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes ovsx publish "$VSIX" $flags -p "$OVSX_PAT"

      - name: Skip Open VSX (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT secret is not set in the publish environment; skipped Open VSX."

      # Requires the Marketplace Trusted Publishing policy described at the top of this file.
      - name: Publish to VS Code Marketplace
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--pre-release"; fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" $flags --oidc